[workspace]
resolver = "2"
members = ["core", "detect", "net", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Lootline contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
lootline-core = { path = "core" }
lootline-detect = { path = "detect" }
lootline-net = { path = "net" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
