[package]
name = "lootline-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
# only the Binomial distribution is used: no nalgebra or rand
statrs = { version = "0.19", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
realfft = "3"
# 0.13 + ring: the same reqwest/rustls/ring that iroh already links, so nothing is duplicated
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
